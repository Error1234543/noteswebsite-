<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ExamGenius AI – Smart Study Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1f2d45;
    --accent: #4f8ef7;
    --accent2: #7c3aed;
    --accent3: #06b6d4;
    --gold: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --text: #e2e8f0;
    --muted: #64748b;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(79,142,247,0.07) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -200px; right: -100px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,58,237,0.07) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  /* HEADER */
  header {
    position: relative; z-index: 10;
    padding: 22px 40px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(10,14,26,0.85);
    backdrop-filter: blur(12px);
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 1.45rem; font-weight: 800;
    background: linear-gradient(135deg, #4f8ef7, #7c3aed);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .logo span { -webkit-text-fill-color: var(--gold); }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .badge {
    font-size: 0.68rem; font-weight: 700;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    padding: 4px 12px; border-radius: 999px;
    letter-spacing: 1px; text-transform: uppercase; color: #fff;
  }

  /* USAGE COUNTER */
  .usage-pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.78rem; font-weight: 600;
    color: var(--muted);
  }
  .usage-pill .dots { display: flex; gap: 4px; }
  .usage-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.3s;
  }
  .usage-dot.used { background: var(--accent2); }
  .usage-dot.all-used { background: var(--red); }

  main {
    position: relative; z-index: 5;
    max-width: 900px; margin: 0 auto;
    padding: 38px 22px 80px;
  }

  /* HERO */
  .hero {
    text-align: center; margin-bottom: 36px;
    animation: fadeUp 0.6s ease both;
  }
  .hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 800; line-height: 1.15; margin-bottom: 10px;
  }
  .hero h1 em {
    font-style: normal;
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero p { color: var(--muted); font-size: 0.95rem; max-width: 500px; margin: 0 auto; }

  /* LIMIT WARNING */
  .limit-banner {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: none;
    align-items: center; gap: 12px;
    margin-bottom: 20px;
    animation: fadeUp 0.4s ease both;
  }
  .limit-banner.show { display: flex; }
  .limit-banner .lb-icon { font-size: 1.5rem; }
  .limit-banner p { color: #fca5a5; font-size: 0.9rem; line-height: 1.5; }
  .limit-banner strong { color: #fff; }
  .reset-info { color: var(--muted); font-size: 0.8rem; margin-top: 3px; }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
    margin-bottom: 18px;
    animation: fadeUp 0.5s ease both;
  }
  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--muted); margin-bottom: 14px;
  }

  /* EXAM SELECTOR */
  .exam-grid { display: flex; flex-wrap: wrap; gap: 9px; }
  .exam-btn {
    padding: 8px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.83rem; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }
  .exam-btn:hover { border-color: var(--accent); color: var(--accent); }
  .exam-btn.active {
    background: var(--accent); border-color: var(--accent);
    color: #fff; box-shadow: 0 0 18px rgba(79,142,247,0.3);
  }

  /* SUBJECT */
  .subject-grid { display: flex; gap: 9px; flex-wrap: wrap; }
  .subject-btn {
    padding: 8px 20px;
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    background: transparent; color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .subject-btn:hover { border-color: var(--accent3); color: var(--accent3); }
  .subject-btn.active {
    border-color: var(--accent3);
    background: rgba(6,182,212,0.08); color: var(--accent3);
  }

  /* LANG */
  .lang-toggle { display: flex; gap: 8px; flex-wrap: wrap; }
  .lang-btn {
    padding: 7px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: transparent; color: var(--muted);
    font-size: 0.83rem; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .lang-btn.active {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border-color: transparent; color: #fff;
    box-shadow: 0 0 16px rgba(124,58,237,0.3);
  }

  /* TOPIC INPUT */
  .input-wrap { position: relative; margin-top: 10px; }
  .topic-input {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 140px 16px 18px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem; outline: none;
    transition: border-color 0.2s;
    resize: none; min-height: 56px; max-height: 120px;
  }
  .topic-input:focus { border-color: var(--accent); }
  .topic-input::placeholder { color: var(--muted); }
  .go-btn {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    padding: 10px 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none; border-radius: 10px;
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.85rem;
    cursor: pointer; transition: opacity 0.2s, transform 0.15s;
    display: flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .go-btn:hover:not(:disabled) { opacity: 0.85; transform: translateY(-50%) scale(1.03); }
  .go-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* CHIPS */
  .example-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .chip {
    padding: 5px 12px; border-radius: 999px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); font-size: 0.77rem; cursor: pointer; transition: all 0.18s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); background: rgba(79,142,247,0.06); }

  /* OUTPUT */
  #output-area { margin-top: 26px; }

  .loading-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px; text-align: center;
  }
  .loading-dots { display: inline-flex; gap: 6px; margin-bottom: 14px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; background: var(--accent2); }
  .dot:nth-child(3) { animation-delay: 0.4s; background: var(--accent3); }

  /* RESULT */
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    animation: fadeUp 0.5s ease both;
  }
  .result-header {
    padding: 18px 26px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface2); flex-wrap: wrap; gap: 10px;
  }
  .result-topic { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; }
  .result-meta { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  .tag {
    padding: 3px 10px; border-radius: 999px;
    font-size: 0.7rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.7px;
  }
  .tag-exam { background: rgba(245,158,11,0.12); color: var(--gold); border: 1px solid rgba(245,158,11,0.25); }
  .tag-subj { background: rgba(6,182,212,0.1); color: var(--accent3); border: 1px solid rgba(6,182,212,0.25); }
  .tag-lang { background: rgba(124,58,237,0.1); color: #a78bfa; border: 1px solid rgba(124,58,237,0.25); }

  .result-body { padding: 26px; }

  .tabs { display: flex; gap: 2px; margin-bottom: 22px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab {
    padding: 9px 18px; background: transparent; border: none;
    color: var(--muted); font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem; font-weight: 500; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: all 0.2s; white-space: nowrap;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text); }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeUp 0.3s ease both; }

  /* NOTES */
  .notes-content h2 {
    font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700;
    color: var(--accent); margin: 20px 0 9px;
    padding-left: 12px; border-left: 3px solid var(--accent);
  }
  .notes-content h3 {
    font-family: 'Syne', sans-serif; font-size: 0.96rem; font-weight: 600;
    color: var(--accent3); margin: 14px 0 7px;
  }
  .notes-content p { line-height: 1.75; color: #cbd5e1; margin-bottom: 9px; font-size: 0.92rem; }
  .notes-content ul, .notes-content ol { padding-left: 20px; margin-bottom: 10px; }
  .notes-content li { line-height: 1.7; color: #cbd5e1; font-size: 0.91rem; margin-bottom: 3px; }
  .notes-content strong { color: #f1f5f9; font-weight: 600; }
  .notes-content em { color: var(--gold); font-style: normal; font-weight: 500; }
  .notes-content code {
    background: var(--surface2); padding: 2px 7px;
    border-radius: 5px; font-size: 0.83rem; color: var(--accent3);
  }
  .notes-content table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.86rem; }
  .notes-content th {
    background: var(--surface2); padding: 9px 13px;
    text-align: left; font-weight: 600;
    border: 1px solid var(--border); color: var(--accent3);
  }
  .notes-content td { padding: 8px 13px; border: 1px solid var(--border); color: #cbd5e1; }
  .notes-content tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

  .short-note {
    background: var(--surface2);
    border-left: 3px solid var(--accent2);
    border-radius: 0 10px 10px 0;
    padding: 12px 16px; margin-bottom: 9px;
    font-size: 0.88rem; color: #cbd5e1; line-height: 1.6;
    transition: border-color 0.2s;
  }
  .short-note:hover { border-color: var(--accent); }
  .short-note strong { color: #f1f5f9; }

  .copy-btn {
    padding: 7px 14px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--muted);
    font-size: 0.78rem; font-family: 'DM Sans', sans-serif;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 4px;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }

  .error-box {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: var(--radius);
    padding: 18px 22px; color: #fca5a5;
    font-size: 0.88rem; animation: fadeUp 0.3s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(0.8); opacity: 0.5; }
    50% { transform: scale(1.2); opacity: 1; }
  }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 600px) {
    header { padding: 16px; }
    main { padding: 20px 12px 60px; }
    .result-header { flex-direction: column; }
    .hero h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Exam<span>Genius</span> AI</div>
  <div class="header-right">
    <div class="usage-pill">
      <span id="usage-text">0/5 today</span>
      <div class="dots" id="usage-dots"></div>
    </div>
    <div class="badge">⚡ Groq AI</div>
  </div>
</header>

<main>
  <div class="hero">
    <h1>Smart Study for <em>Every Exam</em></h1>
    <p>Deep notes, important points aur short summaries — apne exam ke level tak.</p>
  </div>

  <!-- LIMIT BANNER -->
  <div class="limit-banner" id="limit-banner">
    <div class="lb-icon">🚫</div>
    <div>
      <p><strong>Aaj ki 5 requests complete ho gayi!</strong> Kal phir aao. 😊</p>
      <p class="reset-info" id="reset-info">Reset ho jayega midnight ke baad.</p>
    </div>
  </div>

  <!-- EXAM -->
  <div class="card" style="animation-delay:0.05s">
    <div class="card-title">🎯 Exam Platform</div>
    <div class="exam-grid" id="exam-grid">
      <button class="exam-btn active" data-exam="NEET">🩺 NEET</button>
      <button class="exam-btn" data-exam="JEE">⚗️ JEE</button>
      <button class="exam-btn" data-exam="GUJCET">🌿 GUJCET</button>
      <button class="exam-btn" data-exam="Board (Gujarat)">📚 Gujarat Board</button>
      <button class="exam-btn" data-exam="Board (CBSE)">📗 CBSE Board</button>
      <button class="exam-btn" data-exam="UPSC">🏛️ UPSC</button>
      <button class="exam-btn" data-exam="GPSC">🏢 GPSC</button>
      <button class="exam-btn" data-exam="SSC">📋 SSC</button>
      <button class="exam-btn" data-exam="General Knowledge">🌍 General</button>
    </div>
  </div>

  <!-- SUBJECT -->
  <div class="card" style="animation-delay:0.1s">
    <div class="card-title">📖 Subject</div>
    <div class="subject-grid" id="subject-grid">
      <button class="subject-btn active" data-subj="Biology">🌱 Biology</button>
      <button class="subject-btn" data-subj="Chemistry">🧪 Chemistry</button>
      <button class="subject-btn" data-subj="Physics">⚡ Physics</button>
      <button class="subject-btn" data-subj="Mathematics">📐 Maths</button>
      <button class="subject-btn" data-subj="History">🏺 History</button>
      <button class="subject-btn" data-subj="Geography">🌏 Geography</button>
      <button class="subject-btn" data-subj="Polity">🏛️ Polity</button>
      <button class="subject-btn" data-subj="Economics">💰 Economics</button>
      <button class="subject-btn" data-subj="Environment">🌿 Environment</button>
    </div>
  </div>

  <!-- LANG + TOPIC -->
  <div class="card" style="animation-delay:0.15s">
    <div class="card-title" style="margin-bottom:16px">🌐 Language & Topic</div>
    <div class="lang-toggle" id="lang-toggle" style="margin-bottom:14px">
      <button class="lang-btn active" data-lang="English">🇬🇧 English</button>
      <button class="lang-btn" data-lang="Gujarati">🇮🇳 ગુજરાતી</button>
      <button class="lang-btn" data-lang="Hindi">🇮🇳 हिंदी</button>
      <button class="lang-btn" data-lang="Hinglish">🤝 Hinglish</button>
    </div>
    <div class="input-wrap">
      <textarea class="topic-input" id="topic-input"
        placeholder="Topic type karo... jaise: Cell Cycle, Photosynthesis, Newton's Laws..."
        rows="1" oninput="autoResize(this)"></textarea>
      <button class="go-btn" id="go-btn" onclick="generateNotes()">
        <span id="btn-text">✨ Generate</span>
      </button>
    </div>
    <div class="example-chips" id="example-chips"></div>
  </div>

  <div id="output-area"></div>
</main>

<script>
// ── STATE ──
let selectedExam = 'NEET';
let selectedSubject = 'Biology';
let selectedLang = 'English';
const DAILY_LIMIT = 5;

// ── USAGE TRACKING ──
function getTodayKey() {
  return 'eg_usage_' + new Date().toISOString().slice(0, 10);
}
function getUsage() {
  return parseInt(localStorage.getItem(getTodayKey()) || '0', 10);
}
function incrementUsage() {
  const key = getTodayKey();
  const val = getUsage() + 1;
  localStorage.setItem(key, val);
  return val;
}
function updateUsageUI() {
  const used = getUsage();
  const remaining = DAILY_LIMIT - used;
  document.getElementById('usage-text').textContent = `${used}/${DAILY_LIMIT} today`;
  const dotsEl = document.getElementById('usage-dots');
  dotsEl.innerHTML = '';
  for (let i = 0; i < DAILY_LIMIT; i++) {
    const d = document.createElement('div');
    d.className = 'usage-dot' + (i < used ? (used >= DAILY_LIMIT ? ' all-used' : ' used') : '');
    dotsEl.appendChild(d);
  }
  const limitBanner = document.getElementById('limit-banner');
  const goBtn = document.getElementById('go-btn');
  if (remaining <= 0) {
    limitBanner.classList.add('show');
    goBtn.disabled = true;
    document.getElementById('btn-text').textContent = '🚫 Limit Reached';
    // Show reset time
    const now = new Date();
    const midnight = new Date(now);
    midnight.setDate(midnight.getDate() + 1);
    midnight.setHours(0, 0, 0, 0);
    const hoursLeft = Math.ceil((midnight - now) / 3600000);
    document.getElementById('reset-info').textContent =
      `⏰ ${hoursLeft} ghante baad reset ho jayega.`;
  } else {
    limitBanner.classList.remove('show');
    goBtn.disabled = false;
    document.getElementById('btn-text').textContent = '✨ Generate';
  }
}

// ── INIT ──
window.onload = () => {
  updateUsageUI();
  updateChips();
};

// ── EXAM ──
document.getElementById('exam-grid').addEventListener('click', e => {
  const btn = e.target.closest('.exam-btn');
  if (!btn) return;
  document.querySelectorAll('.exam-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedExam = btn.dataset.exam;
});

// ── SUBJECT ──
document.getElementById('subject-grid').addEventListener('click', e => {
  const btn = e.target.closest('.subject-btn');
  if (!btn) return;
  document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedSubject = btn.dataset.subj;
  updateChips();
});

// ── LANG ──
document.getElementById('lang-toggle').addEventListener('click', e => {
  const btn = e.target.closest('.lang-btn');
  if (!btn) return;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedLang = btn.dataset.lang;
});

// ── CHIPS ──
const topicsBySubject = {
  Biology: ['Cell Cycle / કોષચક્ર','Photosynthesis / પ્રકાશસંશ્લેષણ','Human Digestive System','DNA Replication','Ecosystem','Mitosis vs Meiosis'],
  Chemistry: ['Chemical Bonding','Periodic Table Trends','Electrochemistry','Organic Reactions','Acid Base Equilibrium','p-Block Elements'],
  Physics: ["Newton's Laws",'Thermodynamics','Optics & Light','Electromagnetic Induction','Nuclear Physics','Work Energy Theorem'],
  Mathematics: ['Trigonometry','Matrices & Determinants','Integration','Probability','Complex Numbers','Differential Equations'],
  History: ['Indus Valley Civilization','Mughal Empire','Indian Independence Movement','World War II','Vedic Period','Maratha Empire'],
  Geography: ['Indian Rivers','Climate Zones','Soil Types','Plate Tectonics','Ocean Currents','Monsoon System'],
  Polity: ['Indian Constitution','Fundamental Rights','Parliament Structure','Panchayati Raj','Emergency Provisions','DPSP'],
  Economics: ['GDP & GNP','Monetary Policy','Inflation','Budget Concepts','GST','Balance of Payments'],
  Environment: ['Biodiversity','Climate Change','Forest Types India','Environmental Laws','Pollution Types','National Parks'],
};
function updateChips() {
  const topics = topicsBySubject[selectedSubject] || [];
  document.getElementById('example-chips').innerHTML = topics.map(t =>
    `<span class="chip" onclick="setTopic('${t.replace(/'/g,"\\'")}')">${t}</span>`
  ).join('');
}
function setTopic(t) {
  const inp = document.getElementById('topic-input');
  inp.value = t; autoResize(inp);
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── GENERATE ──
async function generateNotes() {
  if (getUsage() >= DAILY_LIMIT) { updateUsageUI(); return; }
  const topic = document.getElementById('topic-input').value.trim();
  if (!topic) { showError('Topic enter karo pehle! 😅'); return; }

  const btn = document.getElementById('go-btn');
  const btnText = document.getElementById('btn-text');
  btn.disabled = true;
  btnText.textContent = '⏳ Generating...';
  showLoading(topic);

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic, exam: selectedExam, subject: selectedSubject, lang: selectedLang })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || `Server error: ${res.status}`);
    }

    const data = await res.json();
    incrementUsage();
    updateUsageUI();
    renderResult(topic, data.result);
  } catch (err) {
    showError(`Error: ${err.message}`);
    btn.disabled = false;
    btnText.textContent = '✨ Generate';
  }
}

// ── RENDER ──
function renderResult(topic, rawText) {
  const s = parseSection(rawText);
  document.getElementById('output-area').innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <div class="result-topic">📖 ${escHtml(topic)}</div>
        <div class="result-meta">
          <span class="tag tag-exam">${selectedExam}</span>
          <span class="tag tag-subj">${selectedSubject}</span>
          <span class="tag tag-lang">${selectedLang}</span>
          <button class="copy-btn" onclick="copyAll()">📋 Copy</button>
        </div>
      </div>
      <div class="result-body">
        <div class="tabs">
          <button class="tab active" onclick="switchTab('deep',this)">📚 Deep Notes</button>
          <button class="tab" onclick="switchTab('imp',this)">⭐ Important</button>
          <button class="tab" onclick="switchTab('short',this)">🚀 Short Notes</button>
          <button class="tab" onclick="switchTab('tips',this)">🎯 Exam Tips</button>
          <button class="tab" onclick="switchTab('raw',this)">📄 Full</button>
        </div>
        <div id="tab-deep" class="tab-content active notes-content">${markdownToHtml(s.deep||rawText)}</div>
        <div id="tab-imp" class="tab-content">${renderPoints(s.imp)}</div>
        <div id="tab-short" class="tab-content">${renderPoints(s.short)}</div>
        <div id="tab-tips" class="tab-content notes-content">${markdownToHtml(s.tips||'<p>Full notes me dekho.</p>')}</div>
        <div id="tab-raw" class="tab-content notes-content">${markdownToHtml(rawText)}</div>
      </div>
    </div>`;
  window._lastRaw = rawText;
  document.getElementById('output-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function parseSection(text) {
  return {
    deep: (text.match(/##\s*📚\s*DEEP NOTES([\s\S]*?)(?=##\s*[⭐🚀🎯]|$)/i)||[])[1]?.trim()||'',
    imp:  (text.match(/##\s*⭐\s*IMPORTANT POINTS([\s\S]*?)(?=##\s*[📚🚀🎯]|$)/i)||[])[1]?.trim()||'',
    short:(text.match(/##\s*🚀\s*SHORT NOTES([\s\S]*?)(?=##\s*[📚⭐🎯]|$)/i)||[])[1]?.trim()||'',
    tips: (text.match(/##\s*🎯\s*EXAM TIPS([\s\S]*?)$/i)||[])[1]?.trim()||'',
  };
}

function renderPoints(text) {
  if (!text) return '<p style="color:var(--muted)">Full Notes tab dekho.</p>';
  return text.split('\n').filter(l=>l.trim().length>3).map(line=>{
    const c = line.replace(/^[\s\-\*\d\.]+/,'').trim();
    return c ? `<div class="short-note">${mdInline(c)}</div>` : '';
  }).join('');
}

function markdownToHtml(text) {
  if (!text) return '';
  let h = escHtml(text);
  h = h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h = h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h = h.replace(/^# (.+)$/gm,'<h2>$1</h2>');
  h = h.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  h = h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  h = h.replace(/`(.+?)`/g,'<code>$1</code>');
  h = h.replace(/^---+$/gm,'<hr style="border-color:var(--border);margin:14px 0"/>');
  h = h.replace(/^(\s*[-*]\s.+)/gm,s=>`<li>${s.replace(/^\s*[-*]\s/,'')}</li>`);
  h = h.replace(/^(\s*\d+\.\s.+)/gm,s=>`<li>${s.replace(/^\s*\d+\.\s/,'')}</li>`);
  h = h.replace(/(<li>.*<\/li>\n?)+/g,m=>`<ul>${m}</ul>`);
  h = h.replace(/\n{2,}/g,'</p><p>');
  h = `<p>${h}</p>`;
  h = h.replace(/<p>\s*(<[hul])/g,'$1').replace(/(<\/[hul][^>]*>)\s*<\/p>/g,'$1').replace(/<p>\s*<\/p>/g,'');
  return h;
}
function mdInline(t){
  let h=escHtml(t);
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  return h;
}
function escHtml(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function switchTab(id,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+id).classList.add('active');
}
function copyAll(){
  if(window._lastRaw){
    navigator.clipboard.writeText(window._lastRaw).then(()=>{
      const b=document.querySelector('.copy-btn');
      b.textContent='✅ Copied!';
      setTimeout(()=>b.textContent='📋 Copy',2000);
    });
  }
}
function showLoading(topic){
  document.getElementById('output-area').innerHTML=`
    <div class="loading-box">
      <div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div style="font-family:'Syne',sans-serif;font-size:1rem;font-weight:600;margin-bottom:6px">"${escHtml(topic)}" ke notes aa rahe hain...</div>
      <div style="color:var(--muted);font-size:0.83rem">🤖 ${selectedExam} • ${selectedSubject} • ${selectedLang}</div>
    </div>`;
}
function showError(msg){
  document.getElementById('output-area').innerHTML=`<div class="error-box">❌ ${escHtml(msg)}</div>`;
}

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('topic-input').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();generateNotes();}
  });
});
</script>
